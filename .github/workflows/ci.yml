name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly dependency audit (M0-A1). Advisories are published without any push
  # to this repo, so a quiet week would otherwise never re-run the audit. Only
  # the `scheduled-audit` job runs on this event; every other job is skipped.
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC

# Superseded PR runs are cancelled; runs on main never are (M0-A1). On main the
# group also carries the run id, so every main run is its own group: neither
# cancel-in-progress nor GitHub's "a newer pending run replaces the older
# pending run" rule can cancel a main run when merges land back to back.
concurrency:
  group: ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || 'latest' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Install, typecheck, test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Frozen install is exactly what both Dockerfiles run. A lockfile that
      # drifts from any package.json fails here instead of at Railway build time.
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @boardroom/omnimind-api exec prisma generate

      - name: Build shared
        run: pnpm --filter @boardroom/shared build

      - name: Typecheck (all packages, server + client)
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # eval/ is not a workspace package, so `pnpm test` (turbo) never reached
      # its vitest suites (metrics, gold validators, persona distinctiveness).
      - name: Eval unit tests
        run: pnpm test:eval

      # services/backup is plain bash; syntax-check every script and run the
      # restore-drill unit test (rclone / pg_restore / psql stubbed — no DB).
      - name: Backup scripts (bash -n + restore-drill test)
        run: |
          for f in services/backup/*.sh services/backup/tests/*.sh; do bash -n "$f"; done
          bash services/backup/tests/restore-drill.test.sh

      # scripts/mcp-go-live.sh is the one-command MCP go-live path (runbook
      # "One-command path"); the test stubs railway / curl / openssl / claude.
      - name: Go-live script (bash -n + stubbed test)
        run: |
          bash -n scripts/mcp-go-live.sh
          bash -n scripts/tests/mcp-go-live.test.sh
          bash scripts/tests/mcp-go-live.test.sh

      # scripts/verify-prod.sh is what post-deploy-verify.yml runs (M1-A1); the
      # test drives it against a local node mock of the three services.
      - name: Post-deploy verify script (bash -n + mock-server test)
        run: |
          bash -n scripts/verify-prod.sh
          bash -n scripts/tests/verify-prod.test.sh
          bash scripts/tests/verify-prod.test.sh

      # scripts/vault-import.mjs loads an Obsidian vault into OmniMind (one memory
      # per note, synced by vault path); mock-server test, no network.
      - name: Vault importer test
        run: node --test scripts/tests/vault-import.test.mjs

      - name: Dependency audit (high+ fails)
        run: pnpm audit --prod --audit-level high

  docker:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        service: [boardroom-ai, omnimind-api, omnimind-mcp]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Builds the exact image Railway builds. Catches frozen-lockfile drift,
      # prompt-integrity failures, and stale tsbuildinfo traps before deploy.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/${{ matrix.service }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  # M1-A3 — the tenant-isolation and scope gate (vitest.e2e.config.ts: E2E-* +
  # the phase-e tripwire) on every PR and main push. Same pgvector service
  # pattern as retrieval-eval. The harness itself creates the extensions,
  # `prisma db push`es the schema into this throwaway database, starts OmniMind
  # on TEST_OMNIMIND_PORT, and spawns packages/omnimind-mcp/dist (hence the
  # MCP build). No model or embedding keys: the harness blanks them on purpose
  # (E2E-4 asserts the outbox path).
  e2e:
    name: E2E (tenant isolation + scope gate, pgvector)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: boardroom_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d boardroom_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://test_user:test_password@localhost:5433/boardroom_test
      TEST_OMNIMIND_PORT: "3399"
    steps:
      # Full history: phase-e-stub-cleanup-due derives its deadline from
      # `git log --merges`; a shallow clone would make that tripwire dormant.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @boardroom/omnimind-api exec prisma generate

      - name: Build shared + omnimind-mcp
        run: |
          pnpm --filter @boardroom/shared build
          pnpm --filter @boardroom/omnimind-mcp build

      - name: E2E suite
        run: pnpm test:e2e

  retrieval-eval:
    name: Retrieval IR eval (pgvector, mock embeddings)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    # Gating happens INSIDE the runner (eval/retrieval/thresholds.json): the
    # job fails when recall@10 / MRR drop below the gates, so a ranker/decay PR
    # cannot merge on a regression. continue-on-error stays false on purpose.
    continue-on-error: false
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: eval
          POSTGRES_PASSWORD: eval
          POSTGRES_DB: omnimind_eval
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eval -d omnimind_eval"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://eval:eval@localhost:5432/omnimind_eval
      OMNIMIND_API_KEY: ci-key
      OMNIMIND_API_URL: http://localhost:3333
      # A1's deterministic embedder (sha256-seeded 1536-dim vectors) — no OpenAI
      # traffic. Until that switch lands, the dummy key makes embeds fail fast and
      # the FTS/trigram/structured layers still carry the eval.
      EMBEDDING_PROVIDER: mock
      ANTHROPIC_API_KEY: ci-dummy
      OPENAI_API_KEY: ci-dummy
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      # NOTE: index.ts skips app.listen() when NODE_ENV=test (supertest owns the
      # port there). `ci` keeps the env validator on and the server listening.
      NODE_ENV: ci
      PORT: "3333"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @boardroom/omnimind-api exec prisma generate

      - name: Build shared + omnimind-api
        run: |
          pnpm --filter @boardroom/shared build
          pnpm --filter @boardroom/omnimind-api build

      # Same sequence as packages/omnimind-api/docker-entrypoint.sh for a FRESH
      # database: extensions first (schema uses the vector type), then
      # `migrate deploy` applies 0_init + every later migration. No baseline
      # resolve — that path is only for databases created with `db push`.
      - name: Enable extensions + migrate deploy
        working-directory: packages/omnimind-api
        run: |
          printf 'CREATE EXTENSION IF NOT EXISTS vector;\nCREATE EXTENSION IF NOT EXISTS pg_trgm;\nCREATE EXTENSION IF NOT EXISTS btree_gin;\n' \
            | pnpm exec prisma db execute --schema prisma/schema.prisma --stdin
          pnpm exec prisma migrate deploy --schema prisma/schema.prisma

      # M0-A3 — migration drift guard: do prisma/migrations reproduce
      # schema.prisma? `migrate diff --from-migrations` replays every migration
      # into a SHADOW database, and Prisma RESETS that database first. So the
      # shadow is its own `omnimind_shadow` database inside this same pgvector
      # service, and --shadow-database-url is NEVER $DATABASE_URL (that is
      # omnimind_eval, the eval database below). The command runs with
      # DATABASE_URL unset, and a row-count snapshot of omnimind_eval taken
      # before and after proves it was not touched. This runs before the API
      # starts, so nothing else writes to omnimind_eval meanwhile.
      #
      # Exit 0 = no drift, 2 = drift, anything else = error. The drift Prisma
      # reports must equal prisma/known-drift.sql (raw-SQL objects that
      # schema.prisma cannot express) once `--` comments and blank lines are
      # removed. Anything else fails: add a migration for the schema change.
      - name: Migration drift guard (separate omnimind_shadow DB)
        working-directory: packages/omnimind-api
        env:
          SHADOW_DATABASE_URL: postgresql://eval:eval@localhost:5432/omnimind_shadow
        run: |
          if [ "$SHADOW_DATABASE_URL" = "$DATABASE_URL" ]; then
            echo "::error::the shadow database URL equals DATABASE_URL; refusing (Prisma resets the shadow database)"
            exit 1
          fi
          snapshot() {
            PGPASSWORD=eval psql -h localhost -U eval -d omnimind_eval -tAc \
              "SELECT (SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public') || ':' || (SELECT count(*) FROM _prisma_migrations) || ':' || (SELECT count(*) FROM users) || ':' || (SELECT count(*) FROM memory_entries)"
          }
          before="$(snapshot)"

          PGPASSWORD=eval psql -h localhost -U eval -d omnimind_eval -c 'CREATE DATABASE omnimind_shadow'
          PGPASSWORD=eval psql -h localhost -U eval -d omnimind_shadow \
            -c 'CREATE EXTENSION IF NOT EXISTS vector' \
            -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm' \
            -c 'CREATE EXTENSION IF NOT EXISTS btree_gin'

          rc=0
          env -u DATABASE_URL pnpm exec prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --script --exit-code > "$RUNNER_TEMP/drift.sql" || rc=$?

          after="$(snapshot)"
          echo "omnimind_eval public tables:_prisma_migrations:users:memory_entries before=${before} after=${after}"
          if [ "$before" != "$after" ]; then
            echo "::error::omnimind_eval changed during the drift check"
            exit 1
          fi
          if [ "$rc" != 0 ] && [ "$rc" != 2 ]; then
            cat "$RUNNER_TEMP/drift.sql"
            echo "::error::prisma migrate diff failed (exit ${rc})"
            exit "$rc"
          fi

          normalize() { grep -v -e '^--' -e '^[[:space:]]*$' "$1" || true; }
          if diff -u <(normalize prisma/known-drift.sql) <(normalize "$RUNNER_TEMP/drift.sql"); then
            echo "migrate diff exit ${rc}: only the accepted drift listed in prisma/known-drift.sql."
          else
            echo "::error::schema.prisma and prisma/migrations disagree beyond prisma/known-drift.sql. Add a migration (pnpm exec prisma migrate dev --create-only), or update known-drift.sql only for a deliberate raw-SQL object."
            echo "Full migrate diff output:"
            cat "$RUNNER_TEMP/drift.sql"
            exit 1
          fi

      - name: Start omnimind-api (background)
        working-directory: packages/omnimind-api
        run: |
          nohup node dist/index.js > "$RUNNER_TEMP/omnimind.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/omnimind.pid"

      - name: Wait for /health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3333/health | grep -q '"dbConnected":true'; then
              echo "healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "omnimind-api did not become healthy"; cat "$RUNNER_TEMP/omnimind.log"; exit 1

      # Seeds the three gold corpora (idempotent, one synthetic user per
      # archetype). The per-user limiter is 20 req/min per method, which the
      # eval client honours — seed + eval take ~6-8 minutes together.
      - name: Seed gold corpora
        run: pnpm eval:retrieval:seed

      # The API stamps created_at = now() on every POST, so all 136 rows would
      # share one timestamp and the temporal slice / recency decay would measure
      # nothing. Spread them per metadata.createdAtOffsetDays (always ≤ 0, hence
      # NOW() + offset). Same statement as eval/retrieval/seed.ts BACKDATE_SQL.
      - name: Backdate seeded memories per createdAtOffsetDays
        working-directory: packages/omnimind-api
        run: |
          printf '%s\n' "UPDATE memory_entries SET created_at = NOW() + ((metadata->>'createdAtOffsetDays')::int * interval '1 day'), valid_at = NOW() + ((metadata->>'createdAtOffsetDays')::int * interval '1 day') WHERE metadata ? 'evalKey' AND metadata ? 'createdAtOffsetDays';" \
            | pnpm exec prisma db execute --schema prisma/schema.prisma --stdin

      # Exit 1 = a gate missed; exit 2 = some query answered non-200 (those are
      # excluded from the metrics and listed in the report).
      - name: IR eval
        run: EVAL_IR_SKIP_SEED=1 pnpm eval:retrieval:ir

      - name: Server log (on failure)
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/omnimind.log" || true

      - name: Stop omnimind-api
        if: always()
        run: kill "$(cat "$RUNNER_TEMP/omnimind.pid")" 2>/dev/null || true

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-ir-results
          path: eval/results/*
          if-no-files-found: warn
          retention-days: 30

  # Weekly audit-only run (M0-A1); runs on the schedule event and nothing else.
  # `pnpm audit` reads pnpm-lock.yaml directly, so there is no install. High+
  # fails the run (the same gate as `verify`); the full report, moderates
  # included, is printed first so a new moderate advisory shows up in the log.
  scheduled-audit:
    name: Scheduled dependency audit
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Full audit report (informational)
        run: pnpm audit --prod || true

      - name: Dependency audit (high+ fails)
        run: pnpm audit --prod --audit-level high
