name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Frozen install is exactly what both Dockerfiles run. A lockfile that
      # drifts from any package.json fails here instead of at Railway build time.
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @boardroom/omnimind-api exec prisma generate

      - name: Build shared
        run: pnpm --filter @boardroom/shared build

      - name: Typecheck (all packages, server + client)
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Dependency audit (high+ fails)
        run: pnpm audit --prod --audit-level high

  docker:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        service: [boardroom-ai, omnimind-api]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Builds the exact image Railway builds. Catches frozen-lockfile drift,
      # prompt-integrity failures, and stale tsbuildinfo traps before deploy.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/${{ matrix.service }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
