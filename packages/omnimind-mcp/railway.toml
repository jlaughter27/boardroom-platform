# Railway config-as-code for the omnimind-mcp service. The Docker build
# context is the REPO ROOT (the Dockerfile COPYs package.json, pnpm-lock.yaml
# and packages/shared from there), so in the Railway service settings:
#   - Root Directory: / (the repository root, NOT packages/omnimind-mcp)
#   - Config-as-code path: packages/omnimind-mcp/railway.toml
# and dockerfilePath below is therefore repo-relative.
[build]
builder = "DOCKERFILE"
dockerfilePath = "packages/omnimind-mcp/Dockerfile"

[deploy]
# GET /health is unauthenticated and bypasses the DNS-rebinding guard, so the
# Railway probe passes regardless of OMNIMIND_MCP_ALLOWED_HOSTS.
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
# MCP sessions live in process memory (keyed by mcp-session-id). A second
# replica would split initialize / follow-up requests across instances and
# clients would see 404 Session not found. Keep 1 until sessions are
# externalized (research roadmap item 13).
numReplicas = 1
